[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADXL345@^1.3.2
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/RTClib@^2.1.3
    boschsensortec/BSEC Software Library@^1.8.1492
    adafruit/Adafruit BusIO@^1.14.1

[env:bus_scan]
build_src_filter = -<*> +<validation/bus_scan.cpp>

[env:i2s_raw_test]
build_src_filter = -<*> +<validation/i2s_raw_test.cpp>

[env:rtc_check]
build_src_filter = -<*> +<validation/rtc_check.cpp>

[env:accel_test]
build_src_filter = -<*> +<validation/accel_test.cpp>

[env:env_test]
build_src_filter = -<*> +<validation/env_test.cpp>

[env:mic_test]
build_src_filter = -<*> +<validation/mic_test.cpp>

[env:sdcard_test]
build_src_filter = -<*> +<validation/sdcard_test.cpp>

[env:power_test]
build_src_filter = -<*> +<validation/power_test.cpp>

[env:naming_test]
build_src_filter = -<*> +<validation/naming_test.cpp>

[env:sdcard_timestamp_test]
build_src_filter = -<*> +<validation/sdcard_timestamp_test.cpp>

[env:dry_run]
build_src_filter = -<*> +<validation/dry_run.cpp>

[env:spi_test]
build_src_filter = -<*> +<validation/spi_test.cpp>

[env:main]
build_src_filter = -<*> +<main.cp